name: SideStore Quelle aktualisieren

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: apps.json aus Release aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_source.py

      - name: Quelle committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/apps.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
            exit 0
          fi
          git commit -m "chore(sidestore): Quelle auf ${GITHUB_REF_NAME} aktualisieren"
          git push
